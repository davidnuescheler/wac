name = "wac"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

account_id = "f9a5d29335f63217bde8c50779556f00"

workers_dev = true

[[r2_buckets]]
binding = "WAC_BUCKET"
bucket_name = "wac"
preview_bucket_name = "wac"

# Upload-key digests live in KV (not git). One key per scope → SHA-256 hex.
#   npx wrangler kv key put --binding WAC_KEYS "org/site" "<sha256-hex>"
[[kv_namespaces]]
binding = "WAC_KEYS"
id = "eb0e678ddc1948928a23b8ad88c5fbc3"
preview_id = "4ec67669f7604cffab7c792b08916b15"

[vars]
MAX_ZIP_BYTES = "52428800"
