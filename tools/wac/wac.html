<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Asset Container</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="s2-tokens.css">
  <link rel="stylesheet" href="wac.css">
</head>
<body>
  <section id="signin">
    <form class="signin-card" id="signin-form">
      <div class="signin-brand">
        <img src="logo.png" alt="" width="32" height="32">
        <div>
          <h1>Web Asset Container</h1>
          <p>Sign in with your email and shared site token. Pick a recent site or add a new one.</p>
        </div>
      </div>
      <label>Email
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@example.com">
      </label>
      <label>Shared password / token
        <input id="token" name="token" type="password" required autocomplete="current-password">
      </label>
      <label id="site-select-label">Site
        <select id="site-select" name="siteSelect"></select>
      </label>
      <div id="new-site-fields" class="hidden">
        <div class="row-2">
          <label>Org
            <input id="org" name="org" autocomplete="organization" placeholder="goodness">
          </label>
          <label>Site
            <input id="site" name="site" placeholder="demo">
          </label>
        </div>
        <p class="hint">Added to your recent sites after sign-in.</p>
      </div>
      <div class="error" id="signin-error" aria-live="polite"></div>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <section id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="" width="20" height="20">
        <span id="nav-org" class="nav-pill"></span>
        <span class="nav-sep" aria-hidden="true">/</span>
        <span id="nav-site" class="nav-pill"></span>
        <span id="session-email" class="nav-branch"></span>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-refresh">
          <span class="s2-icon s2-icon-refresh" aria-hidden="true"></span>
          Refresh
        </button>
        <button type="button" id="btn-upload" class="primary">
          <span class="s2-icon s2-icon-upload-cloud" aria-hidden="true"></span>
          Upload
        </button>
        <button type="button" id="btn-switch-site">Switch site</button>
        <button type="button" id="btn-signout">Sign out</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="side-head">
          <h2>Containers</h2>
          <span class="status" id="list-status"></span>
        </div>
        <div class="tree" id="tree"></div>
        <div class="side-foot">
          <button type="button" id="btn-replace" disabled>
            <span class="s2-icon s2-icon-upload" aria-hidden="true"></span>
            Replace selected
          </button>
          <button type="button" id="btn-delete" class="danger" disabled>
            <span class="s2-icon s2-icon-delete" aria-hidden="true"></span>
            Delete selected
          </button>
        </div>
      </aside>
      <main class="preview">
        <div class="preview-bar">
          <select id="preview-file" disabled aria-label="HTML file to preview">
            <option value="">Select a container to preview</option>
          </select>
          <button type="button" id="btn-open" disabled>Open ↗</button>
        </div>
        <div class="preview-frame">
          <div class="preview-empty" id="preview-empty">Select a container from the list.</div>
          <iframe id="preview" class="hidden" title="Web Asset Container preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </div>
      </main>
      <aside class="content-panel" aria-label="Content overlay">
        <div class="content-head">
          <h2>Content</h2>
          <div class="content-actions">
            <span class="status" id="content-status"></span>
            <button type="button" id="btn-copy-block" disabled>Copy block</button>
          </div>
        </div>
        <textarea id="content-text" spellcheck="false" disabled placeholder="Select a container to edit its text overlay"></textarea>
      </aside>
    </div>
  </section>

  <div id="upload-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="upload-title">
    <form class="modal" id="upload-form">
      <div class="modal-head">
        <h3 id="upload-title">Upload</h3>
        <button type="button" id="upload-cancel" class="icon-btn" aria-label="Close">
          <span class="s2-icon s2-icon-close" aria-hidden="true"></span>
        </button>
      </div>
      <div class="intent hidden" id="upload-intent" aria-live="polite"></div>
      <div class="dropzone" id="dropzone" tabindex="0">
        <span class="s2-icon s2-icon-upload-cloud dropzone-icon" aria-hidden="true"></span>
        <p class="dropzone-title" id="dropzone-title">Drop a .zip here</p>
        <p class="dropzone-sub" id="dropzone-sub">or click to choose</p>
        <p class="dropzone-file hidden" id="dropzone-file"></p>
        <input id="zip-file" name="zip" type="file" accept=".zip,application/zip" required>
      </div>
      <label>Path
        <input id="wac-path" name="wacPath" required pattern="[A-Za-z0-9._\-]+(?:/[A-Za-z0-9._\-]+)*"
          placeholder="drafts/david/my-fun">
      </label>
      <details id="zip-details" class="zip-details hidden">
        <summary id="zip-summary"></summary>
        <div class="file-list" id="file-list"></div>
      </details>
      <div id="default-picker" class="hidden">
        <label>Default page
          <select id="default-asset"></select>
        </label>
      </div>
      <div class="status" id="upload-status"></div>
      <div class="actions">
        <button type="button" id="upload-dismiss">Cancel</button>
        <button class="primary" type="submit" id="upload-submit">Upload</button>
      </div>
    </form>
  </div>

  <div id="page-drop" class="page-drop" aria-hidden="true">
    <div>
      <span class="s2-icon s2-icon-upload-cloud page-drop-icon" aria-hidden="true"></span>
      <h2 id="page-drop-title">Drop zip to upload</h2>
      <p id="page-drop-sub"></p>
    </div>
  </div>

  <script type="module" src="wac.js"></script>
</body>
</html>
